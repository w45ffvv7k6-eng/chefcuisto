# Met à jour la base de données et les fonctions serveur Supabase
# quand le dossier "supabase/" change.
name: Mettre à jour Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Vérifier la configuration
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Il manque le secret SUPABASE_ACCESS_TOKEN ou la variable SUPABASE_PROJECT_REF (voir le README)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Mettre à jour la base de données
        run: ./scripts/migrer.sh
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Déployer les fonctions serveur
        run: |
          if [ -d supabase/functions ] && [ -n "$(ls -A supabase/functions)" ]; then
            supabase functions deploy --project-ref "$PROJECT_REF"
          fi
